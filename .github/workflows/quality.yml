name: Quality and security

on:
  pull_request:
  push:
    branches: [main, develop, feature/**, feat/**, codex/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voya_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d voya_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run test:memory
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify pinned OpenWA event privacy
        run: node infra/openwa/build.mjs --check
      # Check the Edge Function graph without installing unrelated frontend dependencies.
      - run: deno check --node-modules-dir=manual supabase/functions/outbox-dispatch/index.ts
      - run: npm run test:coverage
      - name: Database integration
        shell: bash
        run: |
          set -o pipefail
          export VOYA_DB_TEST=1
          export DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/voya_test
          npm run test:db 2>&1 | tee database-integration.log
          node scripts/test-auth-rate-limit-v1-upgrade.mjs 2>&1 | tee -a database-integration.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pr10_final_regressions.sql 2>&1 | tee -a database-integration.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pr12_ai_data_entry_review_regressions.sql 2>&1 | tee -a database-integration.log
          node scripts/test-owner-member-concurrency.mjs 2>&1 | tee -a database-integration.log
      - name: Upload database integration log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: database-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: database-integration.log
          if-no-files-found: ignore
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: env NEXT_PUBLIC_SUPABASE_URL=https://build-check.supabase.co NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=build-check-key VOYA_APP_URL=https://app.build-check.example npm run build
      - run: npm run test:production:unit
      - run: npm run test:production
      - run: npm run test:e2e:auth-local
      - run: npm audit --omit=dev --audit-level=high
      # Dependabot-triggered runs never receive repository secrets, so a bare
      # Snyk step failed every dependency PR with SNYK-0005 (401). Detect the
      # credential first and skip loudly instead of failing closed on a scanner
      # that cannot authenticate; npm audit and Trivy still gate every run.
      - name: Detect Snyk credential
        id: snyk-credential
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Snyk skipped: this run has no SNYK_TOKEN (Dependabot runs do not receive repository secrets). npm audit and Trivy still gate it."
          fi
      - name: Snyk dependency scan
        if: ${{ steps.snyk-credential.outputs.available == 'true' }}
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,.git,.next,coverage,test-results,playwright-report
          severity: HIGH,CRITICAL
          exit-code: "1"
