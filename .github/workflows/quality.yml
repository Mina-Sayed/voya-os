name: Quality and security

on:
  pull_request:
  push:
    branches: [main, develop, feature/**, feat/**, codex/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voya_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d voya_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run test:memory
      - run: npm run lint
      - run: npm run typecheck
      - run: deno check --node-modules-dir=auto supabase/functions/outbox-dispatch/index.ts
      - run: npm run test:coverage
      - name: Database integration
        shell: bash
        run: |
          set -o pipefail
          export VOYA_DB_TEST=1
          export DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/voya_test
          npm run test:db 2>&1 | tee database-integration.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pr10_final_regressions.sql 2>&1 | tee -a database-integration.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pr12_ai_data_entry_review_regressions.sql 2>&1 | tee -a database-integration.log
          node scripts/test-owner-member-concurrency.mjs 2>&1 | tee -a database-integration.log
      - name: Upload database integration log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: database-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: database-integration.log
          if-no-files-found: ignore
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: env NEXT_PUBLIC_SUPABASE_URL=https://build-check.supabase.co NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=build-check-key VOYA_APP_URL=https://app.build-check.example npm run build
      - run: npm run test:production:unit
      - run: npm run test:production
      # Reset database before E2E auth tests to prevent constraint violations
      - run: VOYA_DB_TEST=1 DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/voya_test npm run db:reset || true
      # Wait for database to be ready after reset
      - run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
      - run: npm run test:e2e:auth-local
      - run: npm audit --omit=dev --audit-level=high
      - uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      - uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,.git,.next,coverage,test-results,playwright-report
          severity: HIGH,CRITICAL
          exit-code: "1"
