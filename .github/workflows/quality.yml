name: Quality and security

on:
  pull_request:
  push:
    branches: [main, feature/**, codex/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voya_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d voya_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:memory
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: VOYA_DB_TEST=1 DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/voya_test npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: env NEXT_PUBLIC_SUPABASE_URL=https://build-check.supabase.co NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=build-check-key VOYA_APP_URL=https://app.build-check.example npm run build
      - run: npm run test:production:unit
      - run: npm run test:production
      - run: npm run test:e2e:auth-local
      - run: npm audit --omit=dev --audit-level=high
      - uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      - uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,.git,.next,coverage,test-results,playwright-report
          severity: HIGH,CRITICAL
          exit-code: "1"
